function hasLocal(){return LOCAL.logs.length||LOCAL.rota.length||LOCAL.cust.length||(LOCAL.rate||[]).length||Object.keys(LOCAL.heart||{}).length}
async function migrate(){const b=$('mgb');if(b){b.disabled=true;b.innerHTML='<span class="load"></span>Copying…'}
try{for(const k of ['logs','rota','cust','rate'])for(const o of (LOCAL[k]||[])){const id=o.id||uid(k[0]);await DB.collection(CO[k]).doc(id).set(Object.assign({},o,{id}))}
for(const id in LOCAL.gem)await DB.collection('gems').doc(id).set({g:!!LOCAL.gem[id]});for(const id in (LOCAL.heart||{}))await DB.collection('hearts').doc(id).set({h:!!LOCAL.heart[id]});
MIG=true;try{localStorage.setItem('fh_mig','1')}catch(e){}toast('Your saved entries are now in the group log.');confetti()}catch(e){dbErr(e)}render()}
function skipMig(){MIG=true;try{localStorage.setItem('fh_mig','1')}catch(e){}render()}
function modeBar(){const m=MODE=='live'?(RO?'<span class="dot o"></span>Group log · view only':'<span class="dot"></span>'+(CREW?'Synced (Live)':'Shared group log · live for all 8 of you')):MODE=='local'?'<span class="dot o"></span>'+(fbOn()?'Not synced · saved on this phone':'Saved on this phone'):MODE=='error'?'<span class="dot o"></span>Group log offline · reconnecting':'<span class="load"></span>Connecting to the group log…';
const m2=/^<span class="dot/.test(m)?m+m.slice(0,m.indexOf('</span>')+7):m;
return `<div class="mode">${m2}</div>${MODE=='live'&&!RO&&!MIG&&hasLocal()?`<div class="card">${H2('Bring your old entries along?')}<p class="hint">This phone has ${LOCAL.logs.length} meal(s), ${LOCAL.rota.length} rota entr${LOCAL.rota.length==1?'y':'ies'} and ${LOCAL.cust.length} spot(s) saved from before the group log. Copy them in so everyone can see them?</p><button class="btn" id="mgb" onclick="migrate()">Copy them to the group log</button><button class="btn s" style="margin-top:10px" onclick="skipMig()">No thanks</button></div>`:''}`}

const fr=[];for(let k=0;k<=6;k++){const t=k/6,a=th+sw*t,rr=r+t*R*.22;fr.push({transform:`translate(${Math.cos(a)*rr}px,${Math.sin(a)*rr}px) scale(${1-t*.5}) rotate(${t*240}deg)`,opacity:k==0?0:k<4?1:1-(t-.5)*1.8})}

const q=pt.getBoundingClientRect(),tx=q.left+q.width/2,ty=q.top+q.height*.4;
for(let k=0;k<12;k++){const s=document.createElement('span');s.className='wsp fixed';s.innerHTML=GSTAR(k%2?'#ffe7a3':'#fff');const z=8+Math.random()*9,a=Math.random()*Math.PI*2,d=22+Math.random()*34;s.style.cssText=`left:${tx}px;top:${ty}px;width:${z}px;height:${z}px;margin:${-z/2}px 0 0 ${-z/2}px`;document.body.appendChild(s);
s.animate([{transform:'scale(.2)',opacity:1},{transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d}px) scale(1) rotate(160deg)`,opacity:0}],{duration:700,easing:'ease-out'}).finished.then(()=>s.remove(),()=>s.remove())}

function plane(sx,sy,r){const p=document.createElement('div');p.className='plane';p.innerHTML='<svg viewBox="0 0 64 40"><path d="M2 21 62 2 27 25z" fill="#fff"/><path d="M27 25 62 2 35 38z" fill="#ece6f7"/><path d="m27 25 8 13-5-10z" fill="#cfc6e6"/></svg>';document.body.appendChild(p);
const ex=innerWidth/2,ey=innerHeight*.45,cx=sx+(ex-sx)*.3+90,cy=Math.min(sy,ey)-150,N=14,fr=[];
for(let k=0;k<=N;k++){const t=k/N,x=(1-t)*(1-t)*sx+2*(1-t)*t*cx+t*t*ex,y=(1-t)*(1-t)*sy+2*(1-t)*t*cy+t*t*ey,dx=2*(1-t)*(cx-sx)+2*t*(ex-cx),dy=2*(1-t)*(cy-sy)+2*t*(ey-cy),a=Math.atan2(dy,dx)*180/Math.PI+16;

function pie(m){const t={};m.forEach(l=>{const r=byId(l.r)||{c:'Other'},k=isAft(r)?'Coffee, tea & dessert':r.c;t[k]=(t[k]||0)+l.amt});

function addLog(){const a=parseFloat($('la').value);if(isNaN(a)||!$('ld').value){alert('Add a date and amount first.');return}
const o={id:uid('l'),r:$('lr').value,d:$('ld').value,amt:a,note:$('ln').value};V.pre='';V.mon=o.d.slice(0,7);document.activeElement&&document.activeElement.blur();addItem('logs',o);render();confetti()}
function delLog(id){if(confirm('Remove this meal for everyone?'))delItem('logs',id)}

/* ---------- TRAIL ---------- */
function map(){return cal()+trail()}
function trail(){const L=[...S.logs].sort((a,b)=>a.d<b.d?-1:1);
if(!L.length)return `<div class="card">${H2('Our Food Trail')}<p class="hint">Your journey appears here once you log your first meal. Head to Stats to start.</p></div>`;
const H=L.length*90+60;let pts=L.map((l,i)=>[i%2?230:70,50+i*90]);
let d=`M${pts[0][0]} ${pts[0][1]}`;for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i],my=(a[1]+b[1])/2;d+=` C${a[0]} ${my},${b[0]} ${my},${b[0]} ${b[1]}`}
const nodes=L.map((l,i)=>{const [x,y]=pts[i],r=x<150,tx=r?x+24:x-24,an=r?'start':'end',nm=rn(l.r),sw=isAft(byId(l.r)||{});
return `<circle cx="${x}" cy="${y}" r="16" fill="${sw?'var(--lav)':i%2?'var(--blue)':'var(--pink)'}" stroke="var(--pk)" stroke-width="3"/><text x="${x}" y="${y+5}" text-anchor="middle" font-size="13" font-weight="800" fill="var(--ink)">${i==L.length-1?'★':i+1}</text>
<text x="${tx}" y="${y-3}" text-anchor="${an}" font-size="12" fill="var(--ink)" font-weight="700">${esc(nm.length>17?nm.slice(0,16)+'…':nm)}</text><text x="${tx}" y="${y+13}" text-anchor="${an}" font-size="11" fill="var(--mut)">${l.d.slice(8)}/${l.d.slice(5,7)}/${l.d.slice(2,4)}</text>`}).join('');
return `<div class="card">${H2('Our Food Trail')}<p class="hint">Every stop on our adventure, in order. Lavender stops are coffee, tea or dessert.</p><svg viewBox="0 0 300 ${H}" width="100%"><path d="${d}" fill="none" stroke="var(--pk)" stroke-width="5" stroke-dasharray="2 10" stroke-linecap="round"/>${nodes}</svg></div>`}

/* ---------- CALENDAR ---------- */
function cal(){const [y,m]=V.cal.split('-').map(Number),first=new Date(y,m-1,1).getDay(),n=new Date(y,m,0).getDate();
let c=['S','M','T','W','T','F','S'].map(x=>`<div class="h">${x}</div>`).join('')+'<div class="h"></div>'.repeat(first);
for(let i=1;i<=n;i++){const ds=`${V.cal}-${String(i).padStart(2,'0')}`,ls=S.logs.filter(l=>l.d==ds);
c+=`<div class="${ls.length?'f':''}"><b>${i}</b>${ls.map(l=>esc(rn(l.r))).join('<br>')}</div>`}
return `<div class="card">${H2('Our Food Calendar')}<div class="row"><button class="btn s" onclick="cm(-1)" aria-label="Previous month">‹</button><b>${new Date(y,m-1).toLocaleString('en',{month:'long',year:'numeric'})}</b><button class="btn s" onclick="cm(1)" aria-label="Next month">›</button></div><div class="cal">${c}</div></div>`}
function cm(k){const [y,m]=V.cal.split('-').map(Number),d=new Date(y,m-1+k,1);V.cal=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;render()}

const norm=s=>String(s||'').trim().toLowerCase();
const findP=s=>{const n=norm(s).replace(/^(dr|ms|mr|mrs)\.?\s+/,'');return P.find(p=>norm(p)==norm(s))||P.find(p=>norm(p).replace(/^ms\s+/,'')==n)||P.find(p=>n&&(n.startsWith(norm(p).replace(/^ms\s+/,''))||norm(p).replace(/^ms\s+/,'').startsWith(n)))};
const RIPAS_DRIVERS=['Ms Fii','Nadiah','Abraham'];
const isRipas=l=>/ripas/i.test(l||'');
const canDrive=x=>x.p!='Haziq'&&(!isRipas(x.l)||RIPAS_DRIVERS.includes(x.p));

function sum(E,hz,dr){
const seats=V.seats,going=E.filter(x=>!offDuty(x));
const byL={};going.forEach(x=>{const k=norm(x.l);(byL[k]=byL[k]||{l:x.l,p:[],d:[]}).p.push(x.p);if(canDrive(x))byL[k].d.push(x.p)});
const G=Object.values(byL).map(g=>{const need=Math.ceil(g.p.length/seats),cars=Math.min(need,g.d.length),stuck=Math.max(0,g.p.length-cars*seats);return Object.assign(g,{need,cars,stuck})});
const cars=G.reduce((a,g)=>a+g.cars,0),stuck=G.reduce((a,g)=>a+g.stuck,0),drivers=G.reduce((a,g)=>a+g.d.length,0);
const pc={},lc={};S.rota.forEach(x=>{pc[x.p]=(pc[x.p]||0)+1;lc[x.l]=(lc[x.l]||0)+1});
const days=new Set(S.rota.map(x=>x.d)).size;
return `<div class="card">${H2('Carpool for '+V.day)}
<label>Seats per car (incl. driver)</label><input type="number" min="2" max="8" value="${seats}" onchange="V.seats=Math.max(2,+this.value||4);render()">
<div class="big">${cars} car${cars==1?'':'s'}</div>
<p class="hint" style="text-align:center">${going.length} going · ${drivers} can drive${stuck?` · <b style="color:var(--pk)">${stuck} without a ride</b>`:''}</p>
${G.map(g=>`<div class="row"><span>${esc(g.l)}<br><span class="avs" style="justify-content:flex-start;margin-top:4px">${g.p.map(p=>av(p,26)).join('')}</span><br><small>${g.d.length?'Drivers: '+g.d.map(esc).join(', '):'No driver here'}</small></span><b>${g.cars} car${g.cars==1?'':'s'}${g.stuck?`<br><small style="color:var(--pk)">${g.stuck} need a lift</small>`:''}</b></div>`).join('')}

async function importOct(){const b=$('o26');if(b){b.disabled=true;b.innerHTML='<span class="load"></span>Adding…'}const have=new Set(S.rota.map(x=>x.id));await putRota(OCT26.filter(x=>!have.has(x.id)).map(x=>Object.assign({},x)));confetti();toast('October roster added')}
function addRota(){if(!$('rl').value.trim())return;const o={id:uid('r'),p:$('rp').value,d:$('rd').value,l:$('rl').value.trim()};V.day=o.d;document.activeElement&&document.activeElement.blur();putRota([o])}
async function putRota(list){for(const o of list){for(const x of S.rota.filter(x=>x.p==o.p&&x.d==o.d&&x.id!=o.id))await delItem('rota',x.id);await addItem('rota',o)}render()}
function upRota(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const L=[];r.result.split(/\r?\n/).forEach(ln=>{const [p,d0,...l]=ln.split(',');if(!d0||!l.length)return;const d=fixD(d0);
const nm=findP(p);if(!nm||!d)return;L.push({id:uid('r'),p:nm,d,l:l.join(',').trim()})});putRota(L).then(()=>toast(L.length+' rota entries added'))};r.readAsText(f)}
function fixD(d){d=String(d||'').trim();const m=d.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/);if(m)d=`${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;return /^\d{4}-\d\d-\d\d$/.test(d)?d:''}

async function shrink(f){const b=await createImageBitmap(f),k=Math.min(1,2000/Math.max(b.width,b.height)),c=document.createElement('canvas');c.width=Math.round(b.width*k);c.height=Math.round(b.height*k);c.getContext('2d').drawImage(b,0,0,c.width,c.height);return new Promise(r=>c.toBlob(r,'image/jpeg',.9))}
async function readRota(){if(!SM||!RIMG)return;const L=await SM.limits().catch(()=>null);if(!L||!L.images){V.rmsg='Image reading is not available in this view.';render();return}

const rows=(Array.isArray(out)?out:[]).map(o=>({p:findP(o.name),d:fixD(o.date),l:String(o.place||'').trim(),k:true})).filter(o=>o.p&&o.d&&o.l);
